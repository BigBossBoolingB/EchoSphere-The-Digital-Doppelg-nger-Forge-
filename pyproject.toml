[tool.poetry]
name = "echosphere"
version = "0.1.0"
description = "EchoSphere: The Digital Doppelgänger Forge"
authors = ["Josephis K. Wade"]
packages = [
    { include = "echosystem" },
]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.109.2"
uvicorn = "^0.17.6"
python-multipart = "^0.0.5"

[tool.poetry.dev-dependencies]
pytest = "^7.1.2"
requests = "^2.27.1"
httpx = "^0.26.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
